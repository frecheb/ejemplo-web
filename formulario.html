<!DOCTYPE html>
<HTML lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name viewport>
		<title>Formulario</title>
		<link rel="stylesheet" href="css/estilo.css">
		<script src="js/funciones.js"></script>
	</head>
	
	<header></header>
	<script>
		cargarHeader();
	</script>

	<main>
		<div class="div-container">
		<h1>Formulario de contacto</h1>
		<form>
			<fieldset>
				<legend>Datos de contacto</legend>
				<!-- NOMBRE -->
				<p>
					<label for="nombre">Nombre*:</label>
					<input type="text" id="nombre" name="nombre" required/>
				</p>

				<!-- APELLIDOS -->
				<p>
					<label for="apellidos">Apellidos*:</label>
					<input type="text" id="apellidos" name="apellidos" required/>
				</p>

				<!-- CONTRASEÑA -->
				<p>
					<label for="contraseña">Contraseña*:</label>
					<input type="text" id="contraseña" name="contraseña" required/>
				</p>

				<!-- EMAIL -->
				<p>
					<label for="correo">Correo electrónico:</label>
					<input type="email" id="email" name="email"/>
				</p>

				<!-- TELÉFONO -->
				<p>
					<label for="telefono">Teléfono:</label>
					<input type="tel" id="telefono" name="telefono"/>
				</p>

				<!-- WEB -->
				<p>
					<label for="web">Página web:</label>
					<input type="url" id="web" name="web"/>
				</p>

				<!-- BUSCAR -->
				<p>
					<label for="buscar">Buscar:</label>
					<input type="search" id="buscar" name="buscar"/>
				</p>
			</fieldset>

			<fieldset>
				<legend>Fechas y horas</legend>
				<!-- FECHA -->
				<p>
					<label for="fecha">Fecha:</label>
					<input type="date" id="fecha" name="fecha"/>
				</p>

				<!-- HORA -->
				<p>
					<label for="hora">Hora:</label>
					<input type="time" id="hora" name="hora"/>
				</p>

				<!-- DATETIME-LOCAL -->
				<p>
					<label for="fechahora">Fecha y hora:</label>
					<input type="datetime-local" id="fechahora" name="fechahora"/>
				</p>

				<!-- MES -->
				<p>
					<label for="mes">Mes:</label>
					<input type="month" id="mes" name="mes"/>
				</p>

				<!-- SEMANA -->
				<p>
					<label for="semana">Semana:</label>
					<input type="week" id="semana" name="semana"/>
				</p>
			</fieldset>

			<fieldset>
				<legend>Valores numéricos</legend>

				<!-- NÚMERO -->
				<p>
					<label for="edad">Edad:</label>
					<input type="number" id="edad" name="edad" min="0" max="120" step="1"/>
				</p>

				<!-- RANGO -->
				<p>
					<label for="valor">Nivel:</label>
					<input type="range" id="valor" name="valor" min="0" max="100"/>
				</p>

				<!-- COLOR -->
				<p>
					<label for="color">Color favorito:</label>
					<input type="color" id="color" name="color"/>
				</p>
			</fieldset>

			<fieldset>
				<legend>Opciones</legend>

				<!-- RADIO -->
				<p>Selecciona una opción:</p>
				<input type="radio" id="opcion1" name="opcion" value="1" />
          		<label for="opcion1">Opción 1</label>

         		 <br/>

          		<input type="radio" id="opcion2" name="opcion" value="2" />
          		<label for="opcion2">Opción 2</label>

          		<br/>

          		<input type="radio" id="opcion3" name="opcion" value="3" />
         		<label for="opcion3">Opción 3</label>

				 <!-- CHECKBOX -->
          		<p>Selecciona tus aficiones:</p>

          		<input type="checkbox" id="deporte" name="aficiones" value="deporte" />
          		<label for="deporte">Deporte</label>

          		<br/>

          		<input type="checkbox" id="musica" name="aficiones" value="musica" />
          		<label for="musica">Música</label>
				
          		<br/>

          		<input type="checkbox" id="informatica" name="aficiones" value="informatica" />
          		<label for="informatica">Informática</label>
        	</fieldset>

        	<fieldset>
        		<legend>Listas</legend>

				<!-- SELECT -->
        		<p>
            	<label for="provincia">Provincia:</label>

            	<select id="provincia" name="provincia">
            		<option value="">Selecciona una provincia</option>

            		<option value="cordoba">Córdoba</option>
            		<option value="ciudad_real">Ciudad Real</option>
            		<option value="toledo">Toledo</option>
            		<option value="jaen">Jaén</option>
            	</select>
          		</p>

          		<!-- SELECT CON GRUPOS -->
          		<p>
            	<label for="estudios">Estudios:</label>

            	<select id="estudios" name="estudios">
            		<optgroup label="Informática">
            			<option value="dam">DAM</option>
            			<option value="daw">DAW</option>
            			<option value="asir">ASIR</option>
            		</optgroup>

              		<optgroup label="Electrónica">
                		<option value="teleco">Sistemas de Telecomunicaciones</option>
                		<option value="electronica">Electrónica</option>
              		</optgroup>
            	</select>
          		</p>

          		<!-- SELECT MULTIPLE -->
          		<p>
            	<label for="lenguajes"> Lenguajes favoritos: </label>

            	<select id="lenguajes" name="lenguajes" multiple size="4">
              	<option value="html">HTML</option>
             	<option value="css">CSS</option>
              	<option value="javascript">JavaScript</option>
              	<option value="java">Java</option>
            	</select>
          		</p>
        	</fieldset>

			<fieldset>
          		<legend>Texto</legend>

          		<!-- TEXTAREA -->
          		<p>
            	<label for="comentarios"> Comentarios: </label>

            	<br />

            	<textarea
              		id="comentarios"
              		name="comentarios"
              		rows="5"
              		cols="40"
              		placeholder="Escribe aquí tus comentarios"
            	>
            	</textarea>
          		</p>
        	</fieldset>

			<fieldset>
          		<legend>Otros elementos</legend>

          		<!-- FILE -->
          		<p>
            	<label for="archivo"> Selecciona un archivo: </label>

            	<input type="file" id="archivo" name="archivo" />
          		</p>

          		<!-- DATALIST -->
          		<p>
            	<label for="navegador"> Navegador favorito: </label>

            	<input list="navegadores" id="navegador" name="navegador" />

            	<datalist id="navegadores">
              		<option value="Chrome"></option>
              		<option value="Firefox"></option>
              		<option value="Edge"></option>
              		<option value="Brave"></option>
            	</datalist>
          		</p>

          		<!-- HIDDEN -->
          		<input type="hidden" name="id_usuario" value="123" />
        	</fieldset>

			<fieldset >
		  		<legend>Botones</legend>

				<p>
				<!-- SUBMIT -->
				<input type="submit" value="Enviar formulario" />

				<!-- RESET -->
				<input type="reset" value="Restablecer formulario" />
				</p>
			</fieldset>
		</form>
		</div>
	</main>
	
        <footer></footer>
		<script>
			cargarFooter();
		</script>

    </body>
</HTML>
